<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Integer Generator Service Architecture</title>
  <desc id="desc">HTTP controllers route requests to application services. Services use repositories to persist tasks, attempts, and balances in PostgreSQL. Generation requests pass from services through the shared provider port, which dispatches to alpha or beta. Both providers send signed callbacks to the HTTP controllers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="black"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: black; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .box { fill: white; stroke: black; stroke-width: 2; }
      .line { fill: none; stroke: black; stroke-width: 2; marker-end: url(#arrow); }
      .return { fill: none; stroke: black; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="620" fill="white"/>
  <text class="heading" x="48" y="52">Service architecture</text>
  <text class="small" x="48" y="80">Request handling, provider dispatch, and durable state</text>

  <rect class="box" x="48" y="132" width="190" height="88"/>
  <text class="label" x="143" y="168" text-anchor="middle">HTTP controllers</text>
  <text class="small" x="143" y="194" text-anchor="middle">generation · payments · callbacks</text>

  <rect class="box" x="305" y="132" width="220" height="88"/>
  <text class="label" x="415" y="168" text-anchor="middle">Application services</text>
  <text class="small" x="415" y="194" text-anchor="middle">admission · billing · orchestration</text>
  <path class="line" d="M238 176 H299"/>

  <rect class="box" x="592" y="132" width="210" height="88"/>
  <text class="label" x="697" y="168" text-anchor="middle">Repositories</text>
  <text class="small" x="697" y="194" text-anchor="middle">tasks · attempts · token ledger</text>
  <path class="line" d="M525 176 H586"/>

  <rect class="box" x="875" y="132" width="195" height="88"/>
  <text class="label" x="972" y="168" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="972" y="194" text-anchor="middle">tasks · attempts · balances</text>
  <path class="line" d="M802 176 H869"/>

  <text class="label" x="48" y="292">Generation provider path</text>

  <rect class="box" x="390" y="310" width="340" height="82"/>
  <text class="label" x="560" y="344" text-anchor="middle">Shared provider port</text>
  <text class="small" x="560" y="371" text-anchor="middle">configured alpha / beta clients</text>
  <path class="line" d="M415 220 V270 H560 V304"/>
  <path class="line" d="M560 392 V425 H220 V444"/>
  <path class="line" d="M560 425 H900 V444"/>

  <rect class="box" x="95" y="450" width="250" height="82"/>
  <text class="label" x="220" y="483" text-anchor="middle">Alpha provider</text>
  <text class="small" x="220" y="510" text-anchor="middle">generation request</text>

  <rect class="box" x="775" y="450" width="250" height="82"/>
  <text class="label" x="900" y="483" text-anchor="middle">Beta provider</text>
  <text class="small" x="900" y="510" text-anchor="middle">generation request</text>

  <path class="return" d="M220 532 V558"/>
  <path class="return" d="M900 532 V558"/>
  <path class="return" d="M900 558 H20"/>
  <path class="return" d="M20 558 V176 H48"/>

  <text class="small" x="48" y="588">Solid arrows: request dispatch and persistence flow</text>
  <path class="line" d="M48 607 H105"/>
  <text class="small" x="126" y="612">Dashed arrows: signed callbacks from both providers to controllers</text>
</svg>
